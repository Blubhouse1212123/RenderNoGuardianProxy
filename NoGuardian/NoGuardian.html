<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoGuardian</title>
    <link rel="icon" type="image/x-icon" href="icon.png">
    <style>
        body {
            background-color: white;
            margin: 0;
        }
        #title {
            position: fixed;
            top: 1%;
            left: 1%;
            width:50%;
            font-size: 50px;
            font-family: monospace;
            font-weight: bold;
        }
        #desc {
            position: fixed;
            top: 8%;
            left: 1%;
            width: 50%;
            font-size: 14px;
            font-family: sans-serif;
        }
        #version {
            position: fixed;
            top: 10%;
            left: 1%;
            width: 50%;
            font-size: 14px;
            font-family: sans-serif;
        }
        #searchBar {
            position: fixed;
            background: none;
            top: 20%;
            left: 1%;
            width: 14%;
            font-size: 20px;
            font-family: monospace;
            border-radius: 8px;
            cursor:pointer;
        }
        #iframe {
            position: fixed;
            top: 30%;
            left: 5%;
            width: 90vw;
            height: 60vh;
            border: 5px solid rgb(0, 0, 0);
            border-radius: 8px;
            background-color: white;
            z-index: 99999;
        }
        #loading {
            position: fixed;
            top: 23%;
            left: 1%;
            width: 14%;
            font-size: 15px;
            display: block;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <input id="searchBar" type="text" placeholder="Enter Url Here">
    <iframe id="iframe"></iframe>
    <div id="title">NoGuardian Proxy</div>
    <div id="desc">An open-source, versatile and fully portable proxy by @Blubhouse1212123</div>
    <div id="loading">Loading Site</div>
    <div id="version">Version 1.0.0</div>
    <script>

        //////////////////
        //FRONTEND SOURCE CODE
        /////////////////
        var loading = true;
        //Dom loaded check for program booting
        //this is to display the alert, and then spit a message to the console. (css styled!)
        document.addEventListener("DOMContentLoaded", function () {
            console.log("%cThanks for using NoGuardian!","color: blue; background: black; font-weight: bold; font-size: 30px;");
            alert("Welcome to NoGuardian! This program was written by @Blubhouse1212123 as a way to bypass Goguardian's website blocks, screw website blocks. Pressing OK will boot the program. Need Help? View the Readme.txt file in the main directory.");
        });
        //Browsing frontend is embedded directly into the HTML because external scripts are CIA.
        //Getting the items from the HTML so we dont have to re-reference them later.
        const iframeID = document.getElementById("iframe");
        const searchBarID = document.getElementById("searchBar");
        var url = 0;
        searchBarID.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                //We have to set the url variable instantly, or else it will have an error at the if statement because the variable
                //is set at the else statement, meaning he attempts to compare if 0 starts with https:// which throws an error.
                url = searchBarID.value;
                //To check if the URL is beginning with the correct statement, this must be done.\
                if (!url.startsWith("https://") && !url.startsWith("http://")) {
                    console.error("NoGuardian has encountered an error! Error details: Failure to display website, url not beginning with proper prefix (eg. https://)");
                    alert("NoGuardian has encountered an error! Error details: Failure to display website, url not beginning with proper prefix (eg. https://)");
                } else {
                    //No Error
                    iframeID.src = "https://rendernoguardianproxy-1.onrender.com/api?url=" + encodeURIComponent(url);
                }

            }
        });
        //Listener for the server sending the href data of the place we want to go
        window.addEventListener("message", ev => {
            console.log(ev);
            var newLocation = ev.data;
            iframeID.src = "https://rendernoguardianproxy-1.onrender.com/api?url=" + encodeURIComponent(newLocation);
        });
    </script>
</body>
</html>
